# Network-level robots policy for the SPA's download routes.
#
# Tessil's privacy model treats /d/<id>#<key> as sensitive — the URL fragment
# carries the decryption key, and even the path alone can leak the existence of
# a transfer to an indexer or scraper.
#
# Include this at SERVER scope of the frontend vhost (NOT inside a location).
# The location-level approach loses the header because the SPA fallback's
# try_files internal redirect to /200.html re-runs location matching, and
# add_header values from the original location are not preserved across that
# redirect. $request_uri keeps the original path, so the conditional below
# evaluates correctly even after the redirect.
#
# Empty $robots_tag → nginx omits the header (documented behaviour). So this
# only emits X-Robots-Tag for the paths below; everything else stays clean.

set $robots_tag "";
# /d/ is a transfer's download page; /p/ a portal's deposit page; /f/ a form's.
if ($request_uri ~ ^/(d|p|f)/) {
    set $robots_tag "noindex, nofollow, noarchive, nosnippet";
}
# The signed-in app and its sign-in pages: their HTML is an empty shell, so
# the header is the only place a crawler can be told.
if ($request_uri ~ ^/(dashboard|login|signin|setup|thanks|styleguide)(/|\?|$)) {
    set $robots_tag "noindex, nofollow";
}
# Markdown copies of pages, made for AI agents: readable by anyone, but the
# page itself is what belongs in a search index.
if ($request_uri ~ \.md(\?|$)) {
    set $robots_tag "noindex";
}
add_header X-Robots-Tag $robots_tag always;
