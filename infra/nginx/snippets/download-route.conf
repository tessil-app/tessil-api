# Network-level robots policy for the SPA's client-only routes.
#
# Tessil's privacy model treats /d/<id>#<key> as sensitive: the URL fragment
# carries the decryption key, and even the path alone can leak the existence of
# a transfer to an indexer or scraper. The account routes carry a noindex meta
# tag once hydrated; the header makes that hold before any JavaScript runs.
#
# Include this at SERVER scope of the frontend vhost (NOT inside a location).
# The location-level approach loses the header because the SPA fallback's
# try_files internal redirect to /200.html re-runs location matching, and
# add_header values from the original location are not preserved across that
# redirect. $request_uri keeps the original path, so the conditional below
# evaluates correctly even after the redirect.
#
# Empty $robots_tag means nginx omits the header (documented behaviour), so
# every indexable page stays clean.

set $robots_tag "";
if ($request_uri ~ ^/(d|dashboard|login|signin|setup|thanks)(/|$|[?])) {
    set $robots_tag "noindex, nofollow, noarchive, nosnippet";
}
add_header X-Robots-Tag $robots_tag always;
