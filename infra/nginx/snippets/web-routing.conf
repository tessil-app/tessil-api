# Routing for the prerendered SvelteKit build on tessil.app.
#
# Include at SERVER scope of the frontend vhost. Replaces the old pair of
# try_files blocks; do not keep both. Requires a build that contains 200.html.
#
# Goals: one URL per page (no .html / trailing-slash duplicates), a real 404
# status for unknown paths, and a long cache on hashed assets. The SPA shell is
# still served as the 404 body so the client router can draw its own not-found
# page; only the status code changes.

# Hashed assets never change under the same name. `expires` rather than
# add_header, so the server-scope security headers are still inherited.
location ^~ /_app/immutable/ {
    expires 1y;
    try_files $uri =404;
}

# The shell is a try_files / error_page target only. Direct requests 404;
# internal redirects still reach it.
location = /200.html {
    internal;
}

# The prerendered homepage under its canonical URL.
location = /index.html {
    return 301 /;
}

# Prerendered pages live at $uri.html on disk; the suffix-less URL is canonical.
location ~ ^/(.+)\.html$ {
    return 301 /$1$is_args$args;
}

location ~ ^/(.+)/$ {
    return 301 /$1$is_args$args;
}

# Client-only route: the download page is never on disk and must be a 200.
location ^~ /d/ {
    try_files /200.html =404;
}

# Ploi's template has no $uri/ in try_files, so `/` would otherwise fall
# through to the shell. Pin it.
location = / {
    try_files /index.html =404;
}

location / {
    try_files $uri $uri.html =404;
}

error_page 404 /200.html;
