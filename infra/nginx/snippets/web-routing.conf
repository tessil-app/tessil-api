# Routing for the prerendered SvelteKit build on tessil.app. Include at SERVER
# scope of the frontend vhost, in place of its own `location = /` and
# `location /` blocks (keep neither). Needs a build with 200.html in it.
#
# What it changes: an address that is not a page now answers 404 instead of a
# 200 with the app shell, which search engines count as a soft 404. The shell
# is still the body, so the app draws its own not-found page. Pages that only
# exist in the browser keep their 200.

# The prerendered homepage, never the shell.
location = / {
    try_files /index.html =404;
}

# Redirects name only the path, so they never carry an internal host or port.
absolute_redirect off;

# One address per page: no .html or trailing-slash duplicates.
location = /index.html { return 301 /; }
location ~ ^/(.+)\.html$ { return 301 /$1$is_args$args; }
location ~ ^/(.+)/$ { return 301 /$1$is_args$args; }

# Pages drawn in the browser: a transfer, a portal, a form, the try-out
# editor, and a portal's or form's own pages in the dashboard.
location ^~ /d/ { try_files /200.html =404; }
location ^~ /p/ { try_files /200.html =404; }
location ^~ /f/ { try_files /200.html =404; }
location = /forms/try { try_files /200.html =404; }
location ^~ /dashboard/ { try_files $uri $uri.html /200.html; }

# Markdown copies of the comparisons, for AI agents.
location ~ \.md$ {
    types { }
    default_type "text/markdown; charset=utf-8";
    try_files $uri =404;
}

# Hashed assets never change under the same name. `expires` rather than
# add_header, so the server-scope security headers still apply.
location ^~ /_app/immutable/ {
    expires 1y;
    try_files $uri =404;
}

# Every other page is a file: /security is security.html.
location / {
    try_files $uri $uri.html =404;
}

# Unknown addresses: the shell as the body, 404 as the status.
error_page 404 /200.html;
location = /200.html {
    internal;
}
