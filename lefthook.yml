# Git hooks managed by lefthook (https://lefthook.dev).
# Hooks install automatically via the `prepare` script in package.json after
# `bun install`. To install manually: `bunx lefthook install`.

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

pre-commit:
  commands:
    block-env-files:
      # Refuse commits that include a .env file. Secrets belong in
      # /etc/tessil/ on the VPS, never in git (see docs/runbooks/secrets.md).
      # `.env.example` is the documented template and is whitelisted: it
      # carries placeholder values, never real secrets.
      # Reads the index directly instead of lefthook's {staged_files}, which
      # substitutes each path pre-quoted: with two or more files staged the
      # assignment parsed as a command with an env prefix, leaving the variable
      # empty so the guard passed on every real commit.
      run: |
        staged=$(git diff --cached --name-only --diff-filter=ACMR)
        blocked=$(printf '%s\n' "$staged" | grep -E '(^|/)\.env(\.|$)' | grep -vE '(^|/)\.env\.example$') || true
        if [ -n "$blocked" ]; then
          echo "✖ refusing commit: .env file is staged"
          printf '%s\n' "$blocked"
          echo "  unstage with: git restore --staged <file>"
          exit 1
        fi
    check-no-raw-ip:
      # IP minimization guardrail — audit doc 19 §4.6 / ADR-0002.
      glob: "{src/**/*.ts,drizzle/**/*.sql}"
      run: bun run check:no-raw-ip
